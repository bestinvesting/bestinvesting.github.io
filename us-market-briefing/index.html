if(view==='compare'){let previous=list().filter(x=>x.date<r.date)[0];$('#content').innerHTML=notice+(previous?`<div class="panel"><h3>${esc(previous.date)} → ${esc(r.date)}</h3><table><thead><tr><th>지수</th><th>이전 브리핑</th><th>선택 브리핑</th></tr></thead><tbody>${r.indices.map(x=>{const before=previous.indices.find(y=>y.name===x.name);return `<tr><td>${esc(x.name)}</td><td class="${marketDirection(before?.change)}">${esc(before?.value||'—')}<br><small>${esc(before?.change||'비교 데이터 없음')}</small></td><td class="${marketDirection(x.change)}">${esc(x.value)}<br><small>${esc(x.change)}</small></td></tr>`}).join('')}</tbody></table><p class="direction-key">상승 녹색 · 하락 파랑 · 보합/미확인 회색. 색상은 각 보고서의 등락 방향이며 투자 유불리를 의미하지 않습니다.</p><h3>이전 요약</h3><p>${esc(previous.summary)}</p><h3>선택일 요약</h3><p>${esc(r.summary)}</p></div>`:'<div class="panel empty"><h3>비교할 브리핑을 기다리고 있습니다.</h3><p>날짜가 다른 실제 브리핑을 2개 이상 저장하면 이전 등록일과 비교할 수 있습니다.</p></div>');return}
let items=r.issues.filter(x=>(category==='전체'||x.category===category)&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));$('#content').innerHTML=notice+`<div class="metrics">${r.indices.map(x=>`<div class="metric"><label>${esc(x.name)}</label><strong class="${marketDirection(x.change)}">${esc(x.value)}</strong><span class="${marketDirection(x.change)}">${esc(x.change)}</span></div>`).join('')}</div><div class="layout"><div><div class="panel summary"><span class="eyebrow">THE BIG PICTURE</span><h3>오늘 시장의 한 문장</h3><p>${esc(r.summary||'시장 종합 요약을 등록해주세요.')}</p><p class="small muted">${esc(r.session)}</p></div><div class="sectiontitle"><h3>핵심 시장 이슈</h3><span class="count">${items.length}건</span></div><div class="tools"><select id="category" aria-label="이슈 분야">${['전체',...new Set(r.issues.map(x=>x.category))].map(x=>`<option ${category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><input id="search" type="search" placeholder="제목, 핵심 요약, 영향 검색" aria-label="이슈 검색" value="${esc(query)}"></div><div id="issues">${items.map(x=>`<article class="card"><span class="badge">${esc(x.category)}</span><h3>${esc(x.title)}</h3>${issueHighlight(x)}<div class="facts"><p>${linkedText(x.summary)}</p><p><b>달라진 점</b>${linkedText(x.changed)}</p><p><b>시장 영향</b>${linkedText(x.impact)}</p></div><details><summary>분석과 출처 보기</summary><p>${linkedText(x.analysis)}</p><p><b>후속 확인</b> ${linkedText(x.follow)}</p>${source(x)}</details></article>`).join('')||'<div class="panel empty">조건에 맞는 이슈가 없습니다.</div>'}</div><div class="sectiontitle"><h3 class="up">↗ 상승 테마 TOP 5</h3></div><div class="panel">${table(r.winners)}</div><div class="sectiontitle"><h3 class="down">↘ 하락 테마 BOTTOM 5</h3></div><div class="panel">${table(r.losers)}</div><div class="sectiontitle"><h3>한국 증시 연결</h3><span class="badge">US → KR</span></div><div class="panel">${table(r.korea)}</div></div><aside><div class="panel"><span class="eyebrow">BRIEFING INDEX</span><h3>오늘의 구성</h3>${[['핵심 이슈',r.issues.length],['상승 테마',r.winners.length],['하락 테마',r.losers.length],['국내 연결',r.korea.length]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="panel"><span class="eyebrow">NEXT TO WATCH</span><h3>후속 점검</h3>${r.watch.map((x,i)=>`<p style="padding:10px 0;border-top:1px solid var(--line)"><b class="up">0${i+1}</b><br>${linkedText(x)}</p>`).join('')||'<p>일정을 등록해주세요.</p>'}</div><div class="panel"><span class="eyebrow">SOURCE DESK</span><h3>원문 확인</h3><p><a href="https://www.federalreserve.gov/" target="_blank" rel="noopener">Federal Reserve ↗</a></p><p><a href="https://www.bls.gov/" target="_blank" rel="noopener">BLS · 경제지표 ↗</a></p><p><a href="https://www.sec.gov/edgar/search/" target="_blank" rel="noopener">SEC · 기업공시 ↗</a></p><p class="muted">위 링크는 조사 출발점이며, 각 이슈의 원문 링크와 함께 확인해주세요.</p></div></aside></div>`;
$('#category').onchange=e=>{category=e.target.value;render()};$('#search').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
let regimes=[],regimeStatus='loading',regimeDate='';
function regimeDates(){return [...new Set(regimes.map(r=>r.date))].sort((a,b)=>b.localeCompare(a));}
function regimeTime(r){return new Date(r.createdAt).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})+' KST';}
function regimeInline(text){let s=esc(text);s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function reportMarkdown(raw){
 const clean=String(raw||'').replace(/<Cite\s+refs=\{.*?\}\s*\/>/g,'').replace(/<badge[^>]*>/g,'').replace(/<\/badge>/g,'').replace(/<icon[^>]*\/>/g,'');
 const lines=clean.split('\n'),out=[];let i=0;
 while(i<lines.length){let line=lines[i].trim();if(!line){i++;continue;}
 if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=t=>t.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());const header=cells(line);i+=2;let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(cells(lines[i++]));out.push('<div class="regime-table"><table><thead><tr>'+header.map(x=>'<th>'+regimeInline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+regimeInline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
 const heading=line.match(/^(#{1,6})\s+(.*)/);if(heading){const level=Math.min(heading[1].length+1,5);out.push(`<h${level}>${regimeInline(heading[2])}</h${level}>`);i++;continue;}
 if(/^[-*]\s+/.test(line)){let rows=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim()))rows.push(lines[i++].trim().replace(/^[-*]\s+/,''));out.push('<ul>'+rows.map(x=>'<li>'+regimeInline(x)+'</li>').join('')+'</ul>');continue;}
 out.push('<p>'+regimeInline(line)+'</p>');i++;
 }return out.join('');
}
function regimeArticle(r,label){return `<article id="regime-report-${esc(r.id)}" class="panel regime-document" tabindex="-1"><span class="eyebrow">${esc(label)} · ${esc(r.date)} · ${esc(regimeTime(r))}</span><h3 class="regime-title">${esc(r.title)}</h3><p class="muted small">${esc(r.asOf)}</p>${r.notice?`<div class="notice">${esc(r.notice)}</div>`:''}<div class="regime-body">${reportMarkdown(r.body)}</div><div class="regime-sources"><h4>출처와 원문</h4>${r.sources.map(x=>source({source:x.url,sourceName:x.label})).join('<br>')}<p class="small muted">등록 ${esc(new Date(r.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))} KST · 원문 보존</p></div></article>`;}
function renderRegime(){
 $('#heading').textContent='시장 레짐';$('#sub').textContent='워시 이후 시장 흐름과 의미 있는 변화의 기록';
 const dates=regimeDates(),control=$('#regime-date');
 if(!dates.includes(regimeDate))regimeDate=dates[0]||'';
 control.disabled=regimeStatus!=='ready'||!dates.length;
 control.innerHTML=dates.length?dates.map(date=>`<option value="${esc(date)}" ${date===regimeDate?'selected':''}>${esc(date)}</option>`).join(''):`<option>${regimeStatus==='loading'?'불러오는 중':regimeStatus==='error'?'불러오기 실패':'등록된 리포트 없음'}</option>`;
 control.onchange=e=>{regimeDate=e.target.value;renderRegime()};
 if(regimeStatus==='loading'){$('#content').innerHTML='<div class="panel empty" role="status">시장 레짐 보고서를 불러오는 중입니다.</div>';return;}
 if(regimeStatus==='error'){$('#content').innerHTML='<div class="panel empty" role="alert">보고서를 불러오지 못했습니다. 저장된 기록은 유지됩니다.<br><button id="regime-retry">다시 불러오기</button></div>';$('#regime-retry').onclick=loadRegimes;return;}
 const latest=regimes[0],history=regimes.slice(1),selected=regimes.filter(x=>x.date===regimeDate);
 $('#content').innerHTML=`<div class="notice"><span>의미 있는 시장 변화가 확인될 때 새 보고서를 추가합니다.</span><span>지난 보고서는 원문 그대로 보존</span></div>${selected.length?selected.map(r=>regimeArticle(r,r.id===latest.id?'LATEST REPORT':'ARCHIVED REPORT')).join(''):'<div class="panel empty">등록된 시장 레짐 보고서가 없습니다.</div>'}<section aria-labelledby="regime-history-heading"><div class="sectiontitle"><h3 id="regime-history-heading">지난 시장 레짐 보고서</h3><span class="count">${history.length}건</span></div><div class="panel"><div class="regime-history">${history.length?history.map(x=>`<div class="regime-history-item"><div><span class="eyebrow">${esc(x.date)} · ${esc(regimeTime(x))}</span><h4>${esc(x.title)}</h4><p class="muted small">${esc(x.summary)}</p></div><button data-regime-open="${esc(x.id)}" aria-expanded="${x.date===regimeDate}">전문 보기</button></div>`).join(''):'<p class="muted">현재 보존된 최신 보고서 외의 과거 원문은 아직 등록되지 않았습니다. 새 보고서가 추가되면 이곳에서 날짜별로 조회할 수 있습니다.</p>'}</div></div></section>`;
 document.querySelectorAll('[data-regime-open]').forEach(b=>b.onclick=()=>{const report=regimes.find(x=>x.id===b.dataset.regimeOpen);if(!report)return;regimeDate=report.date;renderRegime();const article=$('#regime-report-'+report.id);article.scrollIntoView({behavior:'smooth',block:'start'});article.focus({preventScroll:true})});
}
async function loadRegimes(){regimeStatus='loading';if(view==='regime')render();try{const r=await fetch('/us-market-briefing/regime-reports.json',{cache:'no-cache'});if(!r.ok)throw Error('Read failed');const rows=await r.json();if(!Array.isArray(rows))throw Error('Invalid report list');regimes=rows.sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)||b.id.localeCompare(a.id));regimeStatus='ready';}catch{regimeStatus='error';}if(view==='regime')render();}

function validate(r){if(!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||isNaN(Date.parse(r.date)))throw Error('date를 YYYY-MM-DD 형식으로 입력해주세요.');if(typeof r.summary!=='string'||typeof r.session!=='string')throw Error('summary, session은 문자열이어야 합니다.');for(let k of ['indices','issues','winners','losers','korea','watch'])if(!Array.isArray(r[k]))throw Error(k+' 배열이 필요합니다.');for(let x of r.indices)if(!x||typeof x.name!=='string')throw Error('indices의 name을 확인해주세요.');for(let x of r.issues)if(!x||typeof x.category!=='string'||typeof x.title!=='string')throw Error('issues의 category와 title을 확인해주세요.');for(let k of ['winners','losers','korea'])for(let x of r[k])if(!x||typeof x.theme!=='string')throw Error(k+'의 theme을 확인해주세요.');return r}
$('#date').onchange=()=>{query='';category='전체';render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;history.replaceState(null,'',view==='regime'?'#regime':location.pathname);render()});async function loadRemote(){try{const res=await fetch('/us-market-briefing/reports.json',{cache:'no-cache'});if(!res.ok)throw Error('서버 응답 오류');reports=await res.json();refreshDates();render();}catch(e){$('#content').innerHTML='<div class="panel empty">브리핑을 불러오지 못했습니다. 잠시 후 새로고침해주세요.</div>';}}
loadRegimes();loadRemote();
</script></html>
